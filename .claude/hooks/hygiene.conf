# bash_hygiene.py mode for off-allowlist Bash commands. Edit the value, takes
# effect on the very next command (the hook re-reads this file every run).
#   ask   -> pause and prompt YOU to approve/reject each off-list command  (default; "go through me")
#   deny  -> hard-block off-list commands silently, like the old behavior   ("don't bug me")
# Allowlisted commands (read-only git, scripts/check_*, wire_main, cd/pwd/mkdir)
# always run silently regardless of this setting. To just let everything run,
# that's settings.json's Bash() allowlist, not this gate.
mode = ask
