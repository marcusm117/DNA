[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afc"
version = "0.0.1"
description = "Autoformalization toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache 2.0"}
authors = []
keywords = ["autoformalization", "mathematics", "lean"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache 2.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "vllm>=0.10.2",
    "openai>=1.102.0",
    "json5>=0.12.0",
    "beautifulsoup4>=4.13.0",
    "aiohttp>=3.12.0",
    "aioboto3>=15.0.0",
    "boto3>=1.38.23",
    "smt-portfolio",
    "numpy",
    "pandas",
    "matplotlib",
    "python-dotenv",
    "requests",
    "tqdm",
    "joblib",
    "wandb",
    "pyvis",
    "networkx",
    # LeanInteract runtime dependencies
    "pydantic>=2",
    "typing-extensions",
    "rich",
    "filelock",
    "packaging",
    "GitPython",
    "lean_interact",
    "dacite",
    "easydict",
]

[project.optional-dependencies]
develop = [
    "black>=24.10.0",
    "flake8>=7.1.1",
    "mypy>=1.16.1",
    "pylint",
]

[project.urls]
Homepage = "https://github.com/your-org/afc"
Repository = "https://github.com/your-org/afc"
Documentation = "https://github.com/your-org/afc#readme"

[tool.setuptools.packages.find]
include = ["afc", "afc.*"]

[tool.black]
line-length = 150
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 150
extend-ignore = ["E203", "BLK100"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "setuptools.*",
    "torch.*",
    "transformers.*",
    "vllm.*",
    "smt_portfolio.*",
    "openai.*",
    "wandb.*",
]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0301",  # line-too-long
    "R1720",  # no-else-raise
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0103",  # invalid-name
    "W1114",  # arguments-out-of-order
    "W0719",  # broad-exception-raised
    "W0718",  # broad-exception-caught
    "R0914",  # too-many-locals
    "R0913",  # too-many-arguments
    "R0915",  # too-many-statements
    "R0917",  # too-many-positional-arguments
    "R0801",  # duplicate-code
    "E0401",  # import-error
]

[tool.pylint.format]
max-line-length = 150
